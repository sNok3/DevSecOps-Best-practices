services:
  app:
    build: .
    image: devsecops-vault
    env_file: .env
    # Wins over .env: MySQL from the db service, logs also go to `docker compose logs`.
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-vault}
      DB_USERNAME: ${DB_USERNAME:-vault}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      LOG_STACK: stderr,daily
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp
      - /data:uid=10001,gid=10001
      - /config:uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # The base image probes Caddy's admin endpoint, which is switched off (admin off).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  db:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vault}
      MYSQL_USER: ${DB_USERNAME:-vault}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # No root password to manage or leak: a random one is generated on first start and never used.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    # No ports: only the app container on the compose network can reach it.
    volumes:
      - dbdata:/var/lib/mysql
    tmpfs:
      - /tmp
      - /var/run/mysqld
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]  # the entrypoint chowns the data dir, then drops to the mysql user
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  storage:
  dbdata:
