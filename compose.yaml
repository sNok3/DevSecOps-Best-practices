services:
  app:
    build: .
    image: devsecops-vault
    env_file: .env
    # Wins over .env: the database lives in the persisted volume, logs also go to `docker compose logs`.
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database.sqlite
      LOG_STACK: stderr,daily
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp
      - /data:uid=10001,gid=10001
      - /config:uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # The base image probes Caddy's admin endpoint, which is switched off (admin off).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  storage:
