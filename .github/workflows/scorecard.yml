name: scorecard
on:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Private repository: results are printed in the job log (no SARIF upload / public publishing).
      # The Branch-Protection check needs a token with admin read; it is skipped without one.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.txt
          results_format: default
          publish_results: false
      - run: cat results.txt
