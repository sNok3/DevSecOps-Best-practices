name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.30.1
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret removed in a later commit is still leaked
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball" gitleaks
      - name: Scan the full git history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .
      - name: Canary - the scanner must still detect the fake secret
        run: |
          if ./gitleaks dir --redact --no-banner tests/fixtures; then
            echo "::error::Canary secret was NOT detected: the secret scanner is broken"
            exit 1
          fi
          echo "Canary detected as expected"
