name: workflow-lint
on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: [main]
    paths: ['.github/**']
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (template injection, excessive permissions, unpinned actions, ...)
        run: pipx run zizmor==1.31.1 --min-severity low .github/workflows
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
