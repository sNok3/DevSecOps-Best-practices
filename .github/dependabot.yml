version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    groups:
      composer-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  # Keeps the SHA-pinned actions in .github/workflows up to date (the version comment is updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
